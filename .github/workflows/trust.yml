name: trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
      - name: Enforce the verified SpecSync lifecycle
        uses: CorvidLabs/spec-sync@v6 # v6.0.0
        with:
          version: 6.0.0
          strict: true
          require-coverage: 100
          lifecycle-enforce: true
