name: trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@e0272543ad5c88ec75cea1e606cc2efa552af25b # v1.2.0-rc.4
      - name: Enforce the verified SpecSync lifecycle
        uses: CorvidLabs/spec-sync@29392630a590c13fcca65bec2a3c0a8f8c9e4081 # v6.0.0-rc.12
        with:
          version: "5.1.1"
          strict: true
          require-coverage: 100
          lifecycle-enforce: true
